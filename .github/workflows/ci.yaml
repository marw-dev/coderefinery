name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GO_VERSION: "1.25.1"
  IMAGE_NAME: coderefinery

jobs:
  # --- JOB 1: QUALITY & TEST ---
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    # Wir starten echte Services für die Integrationstests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coderefinery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 1. Linter (Statische Code-Analyse)
      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      # 2. Security Scan (GoSec)
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...

      # 3. Tests ausführen
      - name: Run Unit & Integration Tests
        # Wir setzen Env-Vars, damit die Tests die Services finden
        env:
          REFINERY_DATABASE_SOURCE: "postgres://postgres:postgres@localhost:5432/coderefinery?sslmode=disable"
          REFINERY_CACHE_REDIS_URL: "redis://localhost:6379/0"
          # Ollama mocken wir im Test oder nutzen Circuit Breaker
          REFINERY_LLM_HOST: "http://localhost:11434"
        run: |
          go test -v -race -coverprofile=coverage.txt ./...

  # --- JOB 2: BUILD DOCKER ---
  build-push:
    name: Build Docker Image
    needs: test # Startet nur, wenn Tests erfolgreich waren
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
