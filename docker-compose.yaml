services:
  app:
    build: .
    container_name: coderefinery_app
    ports:
      - "8080:8080"
    environment:
      - REFINERY_ENVIRONMENT=production
      - REFINERY_DATABASE_SOURCE=postgres://refinery:secret@postgres:5432/coderefinery?sslmode=disable
      - REFINERY_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - REFINERY_VECTORDB_HOST=weaviate:8080
      - REFINERY_VECTORDB_SCHEME=http
      - REFINERY_CACHE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - weaviate
    volumes:
      - ./config.yaml:/app/config.yaml

  postgres:
    image: postgres:16-alpine
    container_name: coderefinery_db
    environment:
      POSTGRES_USER: refinery
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: coderefinery
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/init.sql

  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    image: semitechnologies/weaviate:1.24.1
    ports:
      - "8090:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

  redis:
    image: redis:alpine
    container_name: coderefinery-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_v2:
  weaviate_data:
